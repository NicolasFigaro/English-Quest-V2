<!doctype html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>English Quest</title>
<link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon.svg">
<meta name="theme-color" content="#111827">
<style>
:root{--bg:#f6f7fb;--card:#fff;--ink:#111827;--mut:#6b7280;--p:#8b7cff;--p2:#5144c7;--mint:#dff8ed;--ok:#16a34a;--bad:#e11d48;--line:#e5e7eb}
:root[data-t=dark]{--bg:#0b1020;--card:#161d33;--ink:#f3f4f6;--mut:#9ca3af;--mint:#12382c;--line:#27304d}
*{box-sizing:border-box}html,body{margin:0}
body{font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--ink);min-height:100%;padding:env(safe-area-inset-top) 0 calc(80px + env(safe-area-inset-bottom))}
main{max-width:560px;margin:0 auto;padding:16px}
header{background:linear-gradient(135deg,var(--p),var(--p2));color:#fff;border-radius:0 0 28px 28px;padding:22px 20px 26px;max-width:560px;margin:0 auto}
.top{display:flex;justify-content:space-between;align-items:center}
h1{font-size:22px;margin:0}h2{margin:4px 0 12px;font-size:19px}
.stats{display:flex;gap:8px;margin-top:14px}
.stat{flex:1;background:rgba(255,255,255,.18);border-radius:14px;padding:8px 10px;font-size:12px}
.stat b{display:block;font-size:18px}
.bar{height:8px;background:rgba(255,255,255,.25);border-radius:9px;margin-top:12px;overflow:hidden}
.bar i{display:block;height:100%;background:#dff8ed;border-radius:9px;transition:width .4s}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:16px;margin-bottom:12px}
.chips{display:flex;gap:6px;overflow-x:auto;padding:4px 0 10px}
.chip{border:1px solid var(--line);background:var(--card);color:var(--ink);padding:7px 14px;border-radius:99px;font-weight:600;cursor:pointer;flex:none}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.game{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:20px;padding:16px;text-align:left;cursor:pointer;font:inherit}
.game:active{transform:scale(.97)}.game span{font-size:28px;display:block}.game b{display:block;margin-top:6px}.game small{color:var(--mut)}
button.btn{background:linear-gradient(135deg,var(--p),var(--p2));color:#fff;border:0;border-radius:14px;padding:13px 18px;font-weight:700;font-size:15px;cursor:pointer;width:100%}
button.ghost{background:var(--mint);color:var(--ink)}
.opt{display:block;width:100%;text-align:left;margin:8px 0;padding:14px;border-radius:14px;border:2px solid var(--line);background:var(--card);color:var(--ink);font:inherit;font-weight:600;cursor:pointer}
.opt.ok{border-color:var(--ok);background:var(--mint)}.opt.bad{border-color:var(--bad)}
.big{font-size:30px;font-weight:800;text-align:center;margin:16px 0}
.flip{perspective:900px;height:200px;margin:10px 0}
.fi{position:relative;height:100%;transition:transform .5s;transform-style:preserve-3d;cursor:pointer}
.fi.f{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;border-radius:22px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:28px;font-weight:800;background:var(--card);border:1px solid var(--line);padding:12px;text-align:center}
.face small{font-size:13px;color:var(--mut);font-weight:500;margin-top:8px}
.back{transform:rotateY(180deg);background:linear-gradient(135deg,var(--p),var(--p2));color:#fff}
.row{display:flex;gap:10px}.row>*{flex:1}
.mem{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.tile{height:76px;border-radius:14px;border:2px solid var(--line);background:var(--card);color:var(--ink);font:600 14px inherit;font-family:inherit;cursor:pointer;padding:4px}
.tile.sel{border-color:var(--p)}.tile.done{background:var(--mint);opacity:.55}
.letters{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:12px 0;min-height:48px}
.lt{width:46px;height:50px;border-radius:12px;border:2px solid var(--line);background:var(--card);color:var(--ink);font-size:22px;font-weight:800;cursor:pointer}
.slot{background:var(--mint)}
input.in{width:100%;padding:14px;border-radius:14px;border:2px solid var(--line);font-size:18px;background:var(--card);color:var(--ink);text-align:center}
nav{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--line);display:flex;justify-content:center;padding:6px 0 calc(6px + env(safe-area-inset-bottom))}
nav button{flex:1;max-width:140px;background:none;border:0;color:var(--mut);font:600 11px inherit;font-family:inherit;cursor:pointer;padding:6px}
nav button.on{color:var(--p2)}nav span{display:block;font-size:22px}
.ib{background:rgba(255,255,255,.2);border:0;color:#fff;border-radius:12px;padding:8px 11px;cursor:pointer;font-size:16px}
.m{color:var(--mut);font-size:13px}.fb{min-height:22px;text-align:center;font-weight:700;margin:6px 0}
.pop{animation:p .5s}@keyframes p{50%{transform:scale(1.12)}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.badge{border:1px solid var(--line);background:var(--card);border-radius:16px;padding:12px;text-align:center}.badge span{font-size:26px;display:block}.badge small{font-size:11px;color:var(--mut)}.lock{opacity:.35;filter:grayscale(1)}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:99px;font-weight:700;font-size:14px;z-index:9}
.w{cursor:pointer;border-bottom:2px dotted var(--p)}.story{font-size:20px;line-height:2}select.in{font-family:inherit}
</style></head><body>
<header><div class="top"><h1>✦ English Quest</h1><div><button class="ib" id="th" aria-label="Tema">🌓</button></div></div>
<div class="stats"><div class="stat">🔥 Racha<b id="sk">0</b></div><div class="stat">⭐ XP<b id="xp">0</b></div><div class="stat">🏅 Nivel<b id="lv">1</b></div><div class="stat">📚 Dominadas<b id="mw">0</b></div></div>
<div class="bar"><i id="pb" style="width:0"></i></div></header>
<main id="v"></main>
<nav><button data-v="home" class="on"><span>🏠</span>Inicio</button><button data-v="games"><span>🎮</span>Juegos</button><button data-v="words"><span>📖</span>Palabras</button><button data-v="profile"><span>🏅</span>Perfil</button></nav>
<script>
const D={A1:[["house","casa"],["water","agua"],["friend","amigo"],["happy","feliz"],["book","libro"],["morning","mañana"],["window","ventana"],["dog","perro"]],
A2:[["travel","viajar"],["weather","clima"],["borrow","pedir prestado"],["tired","cansado"],["cheap","barato"],["neighbor","vecino"],["sometimes","a veces"],["ticket","boleto"]],
B1:[["achieve","lograr"],["improve","mejorar"],["though","aunque"],["afford","permitirse"],["reliable","confiable"],["career","carrera"],["growth","crecimiento"],["rely on","depender de"]],
B2:[["overcome","superar"],["reluctant","reacio"],["drawback","desventaja"],["thorough","minucioso"],["cope with","lidiar con"],["outcome","resultado"],["seldom","rara vez"],["fulfil","cumplir"]],
C1:[["elaborate","elaborar"],["ubiquitous","omnipresente"],["undermine","socavar"],["meticulous","meticuloso"],["leverage","aprovechar"],["notwithstanding","no obstante"],["scrutiny","escrutinio"],["mitigate","mitigar"]],
C2:[["ephemeral","efímero"],["quintessential","por excelencia"],["serendipity","hallazgo afortunado"],["obfuscate","ofuscar"],["lackadaisical","apático"],["perfunctory","superficial"],["recalcitrant","terco"],["juxtapose","yuxtaponer"]],
Verbos:[["go – went – gone","ir"],["eat – ate – eaten","comer"],["see – saw – seen","ver"],["take – took – taken","tomar"],["write – wrote – written","escribir"],["buy – bought – bought","comprar"],["think – thought – thought","pensar"],["begin – began – begun","empezar"]],
Phrasal:[["give up","rendirse"],["look for","buscar"],["turn on","encender"],["find out","descubrir"],["come back","volver"],["put off","posponer"],["carry on","continuar"],["run out of","quedarse sin"]]};
const SENT={A1:[["I ___ a dog.","have","has","am","is"],["She ___ happy.","is","are","am","be"]],
A2:[["Yesterday I ___ to the park.","went","go","gone","going"],["My house is ___ than yours.","bigger","big","more big","biggest"]],
B1:[["If it rains, we ___ at home.","will stay","stay","stayed","would stay"],["I have lived here ___ 2015.","since","for","from","during"]],
B2:[["She suggested ___ earlier.","leaving","to leave","leave","left"],["I wish I ___ more time.","had","have","would have","has"]],
C1:[["Had I known, I ___ differently.","would have acted","will act","acted","would act"],["Not only ___ late, but he also forgot.","was he","he was","is he","he is"]],
C2:[["The proposal, ___ merits are obvious, was rejected.","whose","which","who","that"],["Were it not for you, I ___ failed.","would have","will have","had","would"]]};
const ST={A1:"My name is Ana. I have a dog. My dog is happy. Every morning I give water to my dog. My friend likes my dog too.",
A2:"Last weekend I wanted to travel, but the weather was bad. I was tired and the ticket was not cheap. My neighbor said sometimes it is better to stay home.",
B1:"I want to achieve my goals and improve my career. Though it is hard, I rely on my friends. Growth takes time, and I cannot afford to give up.",
B2:"Despite the drawbacks, she was reluctant to quit. She had to overcome fear and cope with change. The outcome was thorough and she seldom regretted it.",
C1:"Her meticulous plan helped her leverage every resource. Notwithstanding the scrutiny, she did not let doubt undermine her work, and it mitigated the risk.",
C2:"It was a quintessential, ephemeral moment, pure serendipity. No one tried to obfuscate the truth, and the perfunctory speech did not matter."};
const LV=Object.keys(D);
let S=JSON.parse(localStorage.getItem("eq")||"null")||{xp:0,streak:0,last:"",box:{},lvl:"A1",theme:"",daily:{d:"",n:0}};
S.ach=S.ach||[];S.rem=S.rem||{on:false,h:19};
const save=()=>{try{localStorage.setItem("eq",JSON.stringify(S))}catch(e){}};
const $=s=>document.querySelector(s),v=$("#v");
const day=()=>new Date().toISOString().slice(0,10);
const rnd=a=>a[Math.floor(Math.random()*a.length)];
const shuf=a=>a.map(x=>[Math.random(),x]).sort((a,b)=>a[0]-b[0]).map(x=>x[1]);
const pool=()=>D[S.lvl].map(([en,es])=>({en,es}));
const box=w=>S.box[w.en]||1;
function say(t){try{const u=new SpeechSynthesisUtterance(t);u.lang="en-US";u.rate=.85;speechSynthesis.cancel();speechSynthesis.speak(u)}catch(e){}}
function touch(){const d=day();if(S.last!==d){const y=new Date(Date.now()-864e5).toISOString().slice(0,10);S.streak=S.last===y?S.streak+1:1;S.last=d}}
function gain(n){touch();if(S.daily.d!==day())S.daily={d:day(),n:0};S.daily.n+=n;S.xp+=n;save();hud()}
function mark(w,ok){S.box[w.en]=ok?Math.min(5,box(w)+1):1;save();hud()}
function hud(){const lvl=Math.floor(S.xp/100)+1;$("#sk").textContent=S.streak;$("#xp").textContent=S.xp;$("#lv").textContent=lvl;
$("#mw").textContent=mastered();$("#pb").style.width=(S.xp%100)+"%";ach()}
function chips(){return `<div class="chips">${LV.map(l=>`<button class="chip ${l==S.lvl?"on":""}" data-l="${l}">${l}</button>`).join("")}</div>`}
function nav(x){document.querySelectorAll("nav button").forEach(b=>b.classList.toggle("on",b.dataset.v==x))}
function go(x){nav(x);({home,games,words,profile})[x]()}
function home(){const g=20,n=S.daily.d===day()?S.daily.n:0,p=Math.min(100,n/g*100);
v.innerHTML=`<h2>¡Hola! 👋</h2>${chips()}
<div class="card"><b>🎯 Meta diaria</b><div class="m">${n}/${g} XP hoy</div><div class="bar" style="background:var(--line)"><i style="width:${p}%;background:var(--p)"></i></div></div>
<div class="card"><b>🧠 Repaso inteligente</b><p class="m">Las palabras que fallas aparecen más seguido (sistema Leitner).</p><button class="btn" data-g="cards">Empezar repaso</button></div>${S.placed?"":`<div class="card"><b>🧭 Prueba de nivel</b><p class="m">12 preguntas para descubrir tu nivel.</p><button class="btn ghost" data-g="place">Hacer prueba</button></div>`}
<div class="card"><b>💡 Tip del día</b><p class="m">${rnd(["Aprende 5 palabras al día y úsalas en una frase propia.","Escucha la pronunciación antes de escribir: oído y vista juntos fijan mejor.","Repasar 5 min cada día vence a estudiar 1 hora una vez a la semana.","Los errores son memoria en construcción: ¡repítelos hasta acertar!"])}</p></div>`}
function games(){v.innerHTML=`<h2>Juegos · ${S.lvl}</h2>${chips()}<div class="grid">
<button class="game" data-g="cards"><span>🃏</span><b>Tarjetas</b><small>Voltea y repasa</small></button>
<button class="game" data-g="quiz"><span>⚡</span><b>Quiz rápido</b><small>Elige la traducción</small></button>
<button class="game" data-g="match"><span>🧩</span><b>Parejas</b><small>Une EN ↔ ES</small></button>
<button class="game" data-g="scr"><span>🔤</span><b>Ordena letras</b><small>Forma la palabra</small></button>
<button class="game" data-g="listen"><span>🎧</span><b>Escucha</b><small>Escribe lo que oyes</small></button>
<button class="game" data-g="fill"><span>✍️</span><b>Es → En</b><small>Escribe en inglés</small></button>
<button class="game" data-g="gap"><span>🧱</span><b>Frases</b><small>Completa la gramática</small></button>
<button class="game" data-g="pron"><span>🎤</span><b>Pronunciación</b><small>Habla y comprueba</small></button>
<button class="game" data-g="story"><span>📖</span><b>Historia</b><small>Toca y traduce</small></button>
<button class="game" data-g="place"><span>🧭</span><b>Prueba de nivel</b><small>12 preguntas</small></button></div>`}
function words(){const p=pool();v.innerHTML=`<h2>Palabras · ${S.lvl}</h2>${chips()}`+p.map(w=>`<div class="card row" style="align-items:center"><div><b>${w.en}</b><div class="m">${w.es}</div></div><div style="flex:none;text-align:right"><button class="ib" style="background:var(--mint);color:var(--ink)" data-s="${w.en}">🔊</button><div class="m">${"●".repeat(box(w))}${"○".repeat(5-box(w))}</div></div></div>`).join("")}
function pick(n){return shuf(pool()).sort((a,b)=>box(a)-box(b)+(Math.random()-.5)*2).slice(0,n)}
let R=0,Q=[],i=0,sc=0;
function end(title){const pc=Math.round(sc/Q.length*100);v.innerHTML=`<div class="card" style="text-align:center"><div class="big pop">${pc>=80?"🏆":pc>=50?"👏":"💪"}</div><h2>${title}</h2><p>${sc}/${Q.length} correctas · +${sc*5} XP</p><button class="btn" data-g="${R}">Jugar otra vez</button><br><br><button class="btn ghost" data-v="games">Más juegos</button></div>`;S.played=(S.played||0)+1;if(sc==Q.length)S.perfect=(S.perfect||0)+1;gain(sc*5)}
function start(g){R=g;i=0;sc=0;nav("games");
if(g=="cards"){Q=pick(6);cards()}else if(g=="quiz"){Q=pick(8);quiz()}else if(g=="match")match();
else if(g=="scr"){Q=pick(6).filter(w=>!w.en.includes(" "));Q.length?scr():v.innerHTML=`<div class="card">Este juego solo funciona con palabras sueltas.<br><br><button class="btn" data-v="games">Volver</button></div>`}
else if(g=="gap"||g=="place"){PM=g=="place";PL={};const mk=(l,x)=>({s:x[0],a:x[1],d:x.slice(2,5),l}),b=LV.indexOf(SENT[S.lvl]?S.lvl:"B1");
Q=PM?LV.slice(0,6).flatMap(l=>SENT[l].map(x=>mk(l,x))):shuf([-1,0,1].flatMap(o=>(SENT[LV[b+o]]||[]).map(x=>mk(LV[b+o],x))));gap()}
else if(g=="pron"){Q=pick(5);pron()}else if(g=="story")story();else if(g=="listen"){Q=pick(6);typ(true)}else{Q=pick(6);typ(false)}}
function head(t){return `<div class="m">${t} · ${i+1}/${Q.length}</div><div class="bar" style="background:var(--line)"><i style="width:${i/Q.length*100}%;background:var(--p)"></i></div>`}
function cards(){if(i>=Q.length)return end("¡Repaso completo!");const w=Q[i];
v.innerHTML=head("Tarjetas")+`<div class="flip"><div class="fi" id="fi"><div class="face">${w.en}<small>Toca para voltear · 🔊</small></div><div class="face back">${w.es}</div></div></div>
<div class="row"><button class="btn ghost" id="no">Repasar 🔁</button><button class="btn" id="yes">Lo sé ✓</button></div>`;
say(w.en);$("#fi").onclick=()=>$("#fi").classList.toggle("f");
$("#no").onclick=()=>{mark(w,0);i++;cards()};$("#yes").onclick=()=>{mark(w,1);sc++;i++;cards()}}
function quiz(){if(i>=Q.length)return end("Quiz terminado");const w=Q[i],r=Math.random()<.5,
a=r?w.en:w.es,ans=r?w.es:w.en,o=shuf([ans,...shuf(pool().filter(x=>x.en!=w.en)).slice(0,3).map(x=>r?x.es:x.en)]);
v.innerHTML=head("Quiz")+`<div class="big">${a}</div><div id="o">${o.map(x=>`<button class="opt">${x}</button>`).join("")}</div>`;
document.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{const ok=b.textContent==ans;b.classList.add(ok?"ok":"bad");
document.querySelectorAll(".opt").forEach(x=>{x.disabled=1;if(x.textContent==ans)x.classList.add("ok")});mark(w,ok);if(ok)sc++;say(w.en);setTimeout(()=>{i++;quiz()},900)})}
function match(){const p=pick(6);let t=shuf(p.flatMap(w=>[{k:w.en,t:w.en,l:"en"},{k:w.en,t:w.es,l:"es"}])),sel=null,left=6,miss=0;
v.innerHTML=`<div class="m">Une cada palabra con su traducción</div><div class="mem">${t.map((x,j)=>`<button class="tile" data-j="${j}">${x.t}</button>`).join("")}</div><div class="fb" id="fb"></div>`;
const B=[...document.querySelectorAll(".tile")];
B.forEach((b,j)=>b.onclick=()=>{if(b.classList.contains("done"))return;if(sel===null){sel=j;b.classList.add("sel");say(t[j].l=="en"?t[j].t:"");return}
if(sel===j){b.classList.remove("sel");sel=null;return}
const a=t[sel],c=t[j];B[sel].classList.remove("sel");
if(a.k==c.k&&a.l!=c.l){B[sel].classList.add("done");b.classList.add("done");mark(p.find(w=>w.en==a.k),1);left--;$("#fb").textContent="✓ ¡Bien!";if(!left){sc=Math.max(1,6-miss);Q=p.slice(0,6);setTimeout(()=>end("¡Todas las parejas!"),500)}}
else{miss++;$("#fb").textContent="✗ Intenta de nuevo";mark(p.find(w=>w.en==a.k),0)}sel=null})}
function scr(){if(i>=Q.length)return end("Letras ordenadas");const w=Q[i],L=w.en.toUpperCase();let got="";
let ls=shuf(L.split("")),tries=0;while(L.length>2&&ls.join("")==L&&tries++<9)ls=shuf(ls);
v.innerHTML=head("Ordena")+`<div class="big">${w.es}</div><div class="letters" id="gt"></div><div class="letters" id="ls"></div><div class="fb" id="fb"></div><button class="btn ghost" id="sk2">Saltar</button>`;
const draw=()=>{$("#gt").innerHTML=L.split("").map((_,k)=>`<div class="lt slot" style="display:grid;place-items:center">${got[k]||""}</div>`).join("");}
draw();ls.forEach(c=>{const b=document.createElement("button");b.className="lt";b.textContent=c;b.onclick=()=>{b.disabled=1;b.style.opacity=.3;got+=c;draw();
if(got.length==L.length){const ok=got==L;$("#fb").textContent=ok?"✓ ¡Correcto!":"✗ Era: "+w.en;$("#fb").style.color=ok?"var(--ok)":"var(--bad)";mark(w,ok);if(ok)sc++;say(w.en);setTimeout(()=>{i++;scr()},1100)}};$("#ls").appendChild(b)});
$("#sk2").onclick=()=>{mark(w,0);i++;scr()}}
function typ(listen){if(i>=Q.length)return end(listen?"Oído entrenado":"Escritura completa");const w=Q[i];
v.innerHTML=head(listen?"Escucha":"Escribe en inglés")+(listen?`<div class="big"><button class="btn" style="width:auto;font-size:30px" id="pl">🔊</button></div><p class="m" style="text-align:center">Pista: ${w.es}</p>`:`<div class="big">${w.es}</div>`)+`<input class="in" id="ti" autocomplete="off" autocapitalize="off" placeholder="Escribe aquí"><div class="fb" id="fb"></div><button class="btn" id="ck">Comprobar</button>`;
if(listen){$("#pl").onclick=()=>say(w.en);setTimeout(()=>say(w.en),300)}
const chk=()=>{const ok=norm($("#ti").value)==norm(w.en);$("#fb").textContent=ok?"✓ ¡Correcto!":"✗ Era: "+w.en;$("#fb").style.color=ok?"var(--ok)":"var(--bad)";mark(w,ok);if(ok)sc++;say(w.en);$("#ck").disabled=1;setTimeout(()=>{i++;typ(listen)},1200)};
$("#ck").onclick=chk;$("#ti").onkeydown=e=>{if(e.key=="Enter")chk()};$("#ti").focus()}
let PM=0,PL={};
const norm=t=>t.toLowerCase().replace(/[^a-z' ]+/g," ").replace(/\s+/g," ").trim();
const mastered=()=>Object.values(S.box).filter(b=>b>=4).length;
const DICT={};Object.values(D).flat().forEach(([en,es])=>DICT[en.toLowerCase()]=es);
function toast(t){const d=document.createElement("div");d.className="toast";d.textContent=t;document.body.appendChild(d);setTimeout(()=>d.remove(),2600)}
const AC=[["🔥","Racha de 3 días",s=>s.streak>=3],["🔥","Racha de 7 días",s=>s.streak>=7],["⭐","100 XP",s=>s.xp>=100],["🌟","500 XP",s=>s.xp>=500],["📚","10 palabras dominadas",()=>mastered()>=10],["🎓","30 palabras dominadas",()=>mastered()>=30],["🎮","10 partidas",s=>(s.played||0)>=10],["💯","Partida perfecta",s=>(s.perfect||0)>=1],["🧭","Prueba de nivel",s=>!!s.placed]];
function ach(){let n=0;AC.forEach(([e,t,f],k)=>{if(!S.ach.includes(k)&&f(S)){S.ach.push(k);n++;toast(e+" ¡Logro: "+t+"!")}});if(n)save()}
function gap(){if(i>=Q.length)return PM?placeEnd():end("Frases completadas");const q=Q[i],o=shuf([q.a,...q.d]);
v.innerHTML=head(PM?"Prueba de nivel":"Frases")+`<div class="big" style="font-size:22px">${q.s}</div><div>${o.map(x=>`<button class="opt">${x}</button>`).join("")}</div>`;
document.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{const ok=b.textContent==q.a;b.classList.add(ok?"ok":"bad");
document.querySelectorAll(".opt").forEach(x=>{x.disabled=1;if(x.textContent==q.a)x.classList.add("ok")});if(ok){sc++;PL[q.l]=(PL[q.l]||0)+1}setTimeout(()=>{i++;gap()},1000)})}
function placeEnd(){let p="A1";for(const l of LV.slice(0,6)){if((PL[l]||0)>=1)p=l;else break}S.placed=p;S.lvl=p;save();
v.innerHTML=`<div class="card" style="text-align:center"><div class="big pop">🧭</div><h2>Tu nivel: ${p}</h2><p class="m">Acertaste ${sc}/${Q.length}. Ajusté tus juegos a este nivel.</p><button class="btn" data-v="games">Ir a jugar</button></div>`;gain(20)}
function pron(){if(i>=Q.length)return end("Pronunciación");const w=Q[i],SR=window.SpeechRecognition||window.webkitSpeechRecognition;
v.innerHTML=head("Pronunciación")+`<div class="big">${w.en}</div><p class="m" style="text-align:center">${w.es}</p><div class="row"><button class="btn ghost" id="pl">🔊 Escuchar</button><button class="btn" id="mic">🎤 Hablar</button></div><div class="fb" id="fb"></div><button class="btn ghost" id="sk2">Saltar</button>`;
if(!SR)$("#fb").textContent="Tu navegador no soporta reconocimiento de voz (prueba Chrome).";
$("#pl").onclick=()=>say(w.en);$("#sk2").onclick=()=>{i++;pron()};
$("#mic").onclick=()=>{if(!SR)return;const r=new SR();r.lang="en-US";r.maxAlternatives=3;$("#fb").textContent="Escuchando…";$("#fb").style.color="";
r.onresult=e=>{const h=[...e.results[0]].map(a=>norm(a.transcript)),ok=h.some(x=>x.includes(norm(w.en)));$("#fb").textContent=ok?"✓ ¡Bien dicho!":"✗ Escuché: "+h[0]+". Intenta otra vez";$("#fb").style.color=ok?"var(--ok)":"var(--bad)";mark(w,ok);if(ok){sc++;setTimeout(()=>{i++;pron()},900)}};
r.onerror=()=>{$("#fb").textContent="No pude escuchar. Revisa el permiso del micrófono."};r.start()}}
function story(){const t=ST[S.lvl]||ST.A2;
v.innerHTML=`<h2>Historia · ${S.lvl}</h2><div class="card story">${t.split(/(\s+)/).map(x=>/\S/.test(x)?`<span class="w" data-w="${x.toLowerCase().replace(/[^a-z']/g,"")}">${x}</span>`:x).join("")}</div><div class="card fb" id="tr">Toca una palabra 👆</div><button class="btn" id="dn">Terminé de leer (+10 XP)</button>`;
$("#dn").onclick=()=>{const k=day()+S.lvl;if(S.story!==k){S.story=k;gain(10);toast("+10 XP")}else toast("Ya sumaste XP por esta historia hoy")}}
function trw(w){const k=Object.keys(DICT).find(k=>k==w||k.split(" ")[0]==w);$("#tr").textContent=w+" → "+(k?DICT[k]:"(sin traducción)");say(w)}
function profile(){nav("profile");v.innerHTML=`<h2>Perfil</h2>
<div class="card"><b>🏅 Logros (${S.ach.length}/${AC.length})</b><div class="grid" style="margin-top:10px">${AC.map(([e,n],k)=>`<div class="badge ${S.ach.includes(k)?"":"lock"}"><span>${e}</span><small>${n}</small></div>`).join("")}</div></div>
<div class="card"><b>🧭 Prueba de nivel</b><p class="m">${S.placed?"Último resultado: "+S.placed:"Descubre tu nivel en 12 preguntas."}</p><button class="btn" data-g="place">Hacer prueba</button></div>
<div class="card"><b>🔔 Recordatorio diario</b><div class="row" style="margin-top:8px"><select id="rh" class="in" style="padding:10px">${[8,12,18,19,20,21].map(h=>`<option value="${h}" ${S.rem.h==h?"selected":""}>${h}:00</option>`).join("")}</select><button class="btn" id="rem">${S.rem.on?"Desactivar":"Activar"}</button></div><p class="m">Te avisa si hoy no has practicado, mientras la app esté abierta o en segundo plano.</p></div>
<div class="card"><b>🤝 Retos con amigos</b><p class="m">Comparte tu progreso y reta a alguien.</p><button class="btn" id="sh">Compartir mi progreso</button></div>
<div class="card"><b>💾 Tu progreso</b><div class="row" style="margin-top:8px"><button class="btn ghost" id="ex">Exportar</button><button class="btn ghost" id="im">Importar</button></div><input type="file" id="imf" accept=".json" hidden></div>`;
$("#rem").onclick=async()=>{if(S.rem.on){S.rem.on=false;save();toast("Recordatorio desactivado");return profile()}
if(!("Notification" in window))return toast("Tu navegador no soporta notificaciones");
if(await Notification.requestPermission()=="granted"){S.rem={on:true,h:+$("#rh").value};save();toast("🔔 Recordatorio activado")}else toast("Permiso denegado");profile()};
$("#sh").onclick=()=>{const t=`Llevo ${S.xp} XP, racha de ${S.streak} días y ${mastered()} palabras dominadas en English Quest. ¡Supérame! 🔥`;
navigator.share?navigator.share({text:t,url:location.href}).catch(()=>{}):navigator.clipboard.writeText(t).then(()=>toast("Copiado: pégalo a tu amigo"))};
$("#ex").onclick=()=>{const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([JSON.stringify(S)],{type:"application/json"}));a.download="english-quest-progreso.json";a.click()};
$("#im").onclick=()=>$("#imf").click();
$("#imf").onchange=e=>{const f=e.target.files[0];if(f)f.text().then(t=>{try{const o=JSON.parse(t);if(typeof o.xp!="number")throw 0;localStorage.setItem("eq",JSON.stringify(o));location.reload()}catch(_){toast("Archivo no válido")}})}}
function remind(){const r=S.rem;if(!r.on||!("Notification" in window)||Notification.permission!="granted")return;
if(new Date().getHours()>=r.h&&S.last!==day()&&S.nt!==day()){S.nt=day();save();const m="¡Hoy aún no practicas! 5 minutos bastan.";
navigator.serviceWorker.ready.then(g=>g.showNotification("English Quest 🔥",{body:m,icon:"icon.svg"})).catch(()=>new Notification("English Quest",{body:m}))}}
setInterval(remind,6e4);remind();
document.addEventListener("click",e=>{const t=e.target.closest("[data-l],[data-g],[data-v],[data-s],[data-w]");if(!t)return;
if(t.dataset.l){S.lvl=t.dataset.l;save();const on=document.querySelector("nav .on").dataset.v;go(on)}
else if(t.dataset.g)start(t.dataset.g);else if(t.dataset.v)go(t.dataset.v);else if(t.dataset.s)say(t.dataset.s);else if(t.dataset.w)trw(t.dataset.w)});
$("#th").onclick=()=>{S.theme=S.theme?"":"dark";document.documentElement.dataset.t=S.theme;save()};
document.documentElement.dataset.t=S.theme;
if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js").catch(()=>{});
hud();home();
</script></body></html>

<script>
/* Tema antes de pintar: elección guardada o, si no hay, la del sistema. Evita el destello. */
try{
  var t=JSON.parse(localStorage.getItem("eq")||"{}").theme;
  if(t!=="light"&&t!=="dark")t=(window.matchMedia&&matchMedia("(prefers-color-scheme: dark)").matches)?"dark":"light";
  document.documentElement.dataset.t=t;
  document.querySelector('meta[name="theme-color"]').content=t==="dark"?"#0f1311":"#f6f8ef";
}catch(e){document.documentElement.dataset.t="light"}
</script>

{l:"A1",id:"a1-5",e:"❓",t:"Negar y preguntar: do / does",x:["Para negar y preguntar en presente simple usamos **do / does**.","Negativa: I **don't** like tea. · She **doesn't** like tea.","Pregunta: **Do** you like tea? · **Does** she like tea? Después de does el verbo vuelve a su forma base (sin -s)."],g:[["I don't like coffee.","No me gusta el café."],["Does she live here?","¿Ella vive aquí?"],["Do they speak English?","¿Ellos hablan inglés?"]],k:"Does ya lleva la -s: «Does she work?» ✓, no «Does she works».",q:[["___ you speak English?","Do","Does","Are","Is","**you** va con **do**."],["She ___ like pizza.","doesn't","don't","isn't","not","**she** → **doesn't**."],["Does he ___ here?","work","works","working","worked","Tras does el verbo va en forma **base**."]]},
{l:"A1",id:"a1-6",e:"🙋",t:"Pronombres y posesivos",x:["Los **pronombres sujeto** hacen la acción: I, you, he, she, it, we, they. Los **objeto** la reciben: me, you, him, her, it, us, them.","Los **posesivos** dicen de quién es algo: **my**, **your**, **his**, **her**, **its**, **our**, **their**. Van antes del sustantivo: my book."],g:[["She loves him.","Ella lo ama."],["This is my phone.","Este es mi teléfono."],["Call us tomorrow.","Llámanos mañana."]],k:"Tras el verbo: me/him/her/us/them. Antes del sustantivo: my/his/her/our/their.",q:[["Maria is my friend. I like ___.","her","she","hers","herself","Es objeto de la frase → **her**."],["That is ___ car. It belongs to them.","their","them","they","theirs","Antes de un sustantivo → posesivo **their**."],["Please help ___.","me","I","my","mine","Después del verbo → pronombre objeto **me**."]]},
{l:"A1",id:"a1-7",e:"👨‍👩‍👧",t:"Vocabulario: la familia",x:["**mother / father** (madre / padre), **sister / brother** (hermana / hermano), **grandmother / grandfather** (abuela / abuelo), **aunt / uncle** (tía / tío), **cousin** (primo/a).","Para hablar de ellos: **my** + familiar + **is** + nombre: My brother is Juan. En plural: **my parents** (mis padres), **my grandparents** (mis abuelos)."],g:[["My mother is a nurse.","Mi madre es enfermera."],["I have two brothers.","Tengo dos hermanos."],["My uncle lives in Cali.","Mi tío vive en Cali."]],k:"parents = padres (¡no «parientes»!). Parientes en general = relatives.",q:[["My mother's sister is my ___.","aunt","uncle","cousin","niece","La hermana de tu madre es tu **aunt** (tía)."],["My father's father is my ___.","grandfather","uncle","brother","cousin","El padre de tu padre es tu **grandfather**."],["My mother and father are my ___.","parents","relatives","brothers","cousins","**parents** = padres."]]},
{l:"A1",id:"a1-8",e:"🍽️",t:"Vocabulario: comida, colores y números",x:["Comida: **bread** (pan), **rice** (arroz), **chicken** (pollo), **apple** (manzana), **milk** (leche). Colores: **red**, **blue**, **green**, **yellow**, **black**, **white**.","Números: one, two, three, four, five, six, seven, eight, nine, ten. Para pedir con cortesía: I **would like** a coffee, please (mejor que «I want»)."],g:[["I would like some bread.","Quisiera un poco de pan."],["The apple is red.","La manzana es roja."],["She has five cats.","Ella tiene cinco gatos."]],k:"El color va **antes** del sustantivo: a red apple (no «an apple red»).",q:[["Milk is ___.","white","blue","black","green","La leche es **white** (blanca)."],["I ___ like a coffee, please.","would","do","am","will","Para pedir con cortesía: **would like**."],["She has a ___ car.","red","car red","redly","reds","El color va **antes** del sustantivo: a red car."]]},
{l:"A2",id:"a2-1",e:"⏪",t:"Pasado simple",x:["El **pasado simple** habla de acciones terminadas: yesterday, last week, in 2020.","Los regulares añaden **-ed**: work → worked. Los irregulares cambian: go → went, eat → ate, see → saw.","Para negar y preguntar se usa **did** + verbo base: I didn't go. Did you go?"],g:[["I played football yesterday.","Ayer jugué fútbol."],["She went to Bogotá.","Ella fue a Bogotá."],["Did you eat?","¿Comiste?"]],k:"Con did / didn't el verbo vuelve a base: «Did she go?» ✓, no «Did she went».",q:[["Yesterday we ___ pizza.","ate","eat","eated","eaten","eat es irregular: **ate**."],["I ___ see him last week.","didn't","don't","wasn't","not","Pasado negativo: **didn't** + base."],["Did she ___ to school?","go","went","goes","gone","Tras did, verbo **base**."]]},
{l:"A2",id:"a2-2",e:"▶️",t:"Presente continuo",x:["El **presente continuo** habla de lo que pasa **ahora** o de planes cercanos.","Se forma con **am / is / are + verbo-ing**: She is reading. They are playing.","Los verbos de estado (know, like, want) casi no se usan en continuo."],g:[["I am studying English.","Estoy estudiando inglés."],["He is cooking dinner.","Él está cocinando la cena."],["We are waiting for you.","Te estamos esperando."]],k:"Sin to be se rompe: «She reading» ✗ → «She is reading» ✓.",q:[["She ___ a book now.","is reading","reads","read","are reading","now → continuo: **is + -ing**."],["They ___ football right now.","are playing","play","is playing","plays","**they** → **are**."],["I ___ you.","know","am knowing","is know","knowing","**know** es verbo de estado: no va en continuo."]]},
{l:"A2",id:"a2-3",e:"⚖️",t:"Comparativos",x:["Para comparar usamos **than** (que).","Adjetivos cortos: **-er**: tall → taller than. Consonante + y: happy → happier.","Adjetivos largos: **more** + adjetivo: more expensive than. Irregulares: good → better, bad → worse."],g:[["My brother is taller than me.","Mi hermano es más alto que yo."],["This bag is more expensive.","Esta bolsa es más cara."],["Your English is better.","Tu inglés es mejor."]],k:"Nunca juntes los dos: «more taller» ✗.",q:[["This book is ___ than that one.","more interesting","interestinger","most interesting","more interest","interesting es largo → **more**."],["She is ___ than me.","taller","more tall","tallest","tall","tall es corto → **-er**."],["Today is ___ than yesterday.","better","gooder","more good","best","good → **better** (irregular)."]]},
{l:"A2",id:"a2-4",e:"📍",t:"Preposiciones de lugar",x:["**in** = dentro (in the box, in Cali) · **on** = sobre una superficie (on the table) · **at** = un punto concreto (at school, at the door).","Otras útiles: **under** (debajo), **next to** (al lado de), **between** (entre), **behind** (detrás), **in front of** (delante de)."],g:[["The keys are on the table.","Las llaves están sobre la mesa."],["She is at school.","Ella está en el colegio."],["The cat is under the bed.","El gato está debajo de la cama."]],k:"Ciudad o país → in · superficie → on · punto concreto → at.",q:[["The book is ___ the table.","on","in","at","between","Superficie → **on**."],["I live ___ Colombia.","in","on","at","under","País → **in**."],["He is waiting ___ the bus stop.","at","in","on","under","Punto concreto → **at**."]]},
{l:"A2",id:"a2-5",e:"⏰",t:"Preposiciones de tiempo",x:["**at** + hora: at 7:30 · **on** + día o fecha: on Monday, on May 5th · **in** + mes, año, estación o parte del día: in July, in 2025, in the morning.","Excepciones: **at night**, **at the weekend**."],g:[["The class starts at 8.","La clase empieza a las 8."],["My birthday is on Friday.","Mi cumpleaños es el viernes."],["I study in the morning.","Estudio en la mañana."]],k:"at = hora · on = día · in = periodos largos.",q:[["See you ___ Monday.","on","in","at","by","Día → **on**."],["The film starts ___ 9 pm.","at","on","in","for","Hora exacta → **at**."],["She was born ___ 1998.","in","on","at","from","Año → **in**."]]},
{l:"A2",id:"a2-6",e:"🧭",t:"There is / There are",x:["Sirve para decir que algo **hay**: **There is** a park near here. **There are** two parks.","**is** → singular o incontable (there is water). **are** → plural. Negativa: there **isn't** / **aren't**. Pregunta: **Is there** a bank? **Are there** any shops?"],g:[["There is a book on the desk.","Hay un libro en el escritorio."],["There are three chairs.","Hay tres sillas."],["Is there a bank near here?","¿Hay un banco cerca?"]],k:"El verbo concuerda con lo que viene **después**: there is a dog / there are dogs.",q:[["There ___ two cats in the garden.","are","is","am","be","two cats es plural → **are**."],["___ there a pharmacy near here?","Is","Are","Do","Does","a pharmacy es singular → **Is there**."],["There ___ any milk.","isn't","aren't","don't","not","milk es incontable → **isn't**."]]},
{l:"A2",id:"a2-7",e:"💪",t:"Can / can't",x:["**can** expresa habilidad o permiso: I can swim. Can I come in? **can't** = no puedo / no se puede.","Después de can el verbo va en **base**, sin -s ni to: She can **speak** English (no «She cans» ni «can to speak»)."],g:[["I can play the guitar.","Sé tocar la guitarra."],["She can't drive.","Ella no sabe manejar."],["Can you help me?","¿Me puedes ayudar?"]],k:"can + verbo base, siempre. Igual para todos: he can, they can.",q:[["She ___ speak three languages.","can","cans","can to","is can","can no cambia: **she can**."],["I can ___ you.","help","helps","to help","helping","Tras can, verbo **base**."],["He ___ swim. He is afraid of water.","can't","can","doesn't","isn't","Negativa de can → **can't**."]]},
{l:"B1",id:"b1-1",e:"🌧️",t:"Primer condicional",x:["El **primer condicional** habla de situaciones reales o posibles en el futuro.","Estructura: **If + presente simple, will + verbo**: If it rains, I will stay home.","Después de if NO se usa will: «If it will rain» ✗."],g:[["If you study, you will pass.","Si estudias, aprobarás."],["If it rains, we will stay home.","Si llueve, nos quedaremos en casa."],["She will call if she can.","Ella llamará si puede."]],k:"If + presente → will + base.",q:[["If I ___ time, I will call you.","have","will have","would have","had","Tras if va **presente simple**."],["If she studies, she ___ the exam.","will pass","passes","would pass","passed","Resultado: **will + base**."],["We will go out if it ___ raining.","stops","will stop","stopped","would stop","if + **presente**."]]},
{l:"B1",id:"b1-2",e:"🕰️",t:"Present perfect",x:["El **present perfect** conecta pasado y presente: experiencias o cosas que empezaron antes y siguen.","Se forma con **have / has + participio**: I have seen it. She has lived here.","**for** + duración (for 3 years) · **since** + inicio (since 2020). No se usa con yesterday, last year, etc."],g:[["I have visited Spain.","He visitado España."],["She has lived here for 3 years.","Ella vive aquí desde hace 3 años."],["We have known him since 2020.","Lo conocemos desde 2020."]],k:"for = cuánto tiempo; since = desde cuándo.",q:[["I have lived here ___ 2019.","since","for","from","during","2019 es un punto de inicio → **since**."],["She ___ already eaten.","has","have","is","did","**she** → **has**."],["They have worked here ___ five years.","for","since","from","at","five years es duración → **for**."]]},
{l:"B1",id:"b1-3",e:"💭",t:"Segundo condicional",x:["Habla de situaciones **imaginarias o poco probables**: If I **had** a million dollars, I **would** travel the world.","Estructura: **If + pasado simple, would + verbo base**. Con be se usa **were** para todos: If I **were** you, I would study."],g:[["If I had time, I would help you.","Si tuviera tiempo, te ayudaría."],["If she were rich, she would buy a house.","Si fuera rica, compraría una casa."],["What would you do?","¿Qué harías?"]],k:"Primer condicional = posible (will). Segundo = imaginario (would).",q:[["If I ___ rich, I would help everyone.","were","am","will be","would be","Imaginario con be → **were**."],["If she studied more, she ___ the exam.","would pass","will pass","passes","passed","Segundo condicional → **would + base**."],["I would travel if I ___ more money.","had","have","would have","will have","if + **pasado simple**."]]},
{l:"B1",id:"b1-4",e:"🔧",t:"Voz pasiva",x:["Se usa cuando importa la **acción** o lo que la recibe, no quién la hace: The window **was broken**.","Estructura: **to be + participio**. Presente: is made. Pasado: was made. Futuro: will be made. Para decir quién: **by**: The book was written by Gabo."],g:[["English is spoken here.","Aquí se habla inglés."],["The car was repaired yesterday.","El carro fue reparado ayer."],["The letter will be sent tomorrow.","La carta será enviada mañana."]],k:"Participios irregulares: make → made, write → written, see → seen.",q:[["The pizza ___ by my brother.","was made","made","was make","is making","Pasiva en pasado: **was + participio**."],["English ___ in many countries.","is spoken","speaks","is speaking","spoke","Pasiva presente: **is + participio**."],["The report will ___ tomorrow.","be sent","send","sent","be sending","Futuro pasivo: **will be + participio**."]]},
{l:"B1",id:"b1-5",e:"🔁",t:"Used to",x:["**used to** + verbo habla de **hábitos o estados del pasado** que ya no ocurren: I **used to** play football (ya no).","Negativa y pregunta con **did**: I **didn't use to** smoke. **Did** you **use to** live here? (sin d)."],g:[["I used to live in Medellín.","Antes vivía en Medellín."],["She used to be shy.","Ella solía ser tímida."],["Did you use to play chess?","¿Solías jugar ajedrez?"]],k:"Con did desaparece la d: didn't **use** to, no «didn't used to».",q:[["When I was a child, I ___ play outside.","used to","use to","am used to","was use to","Hábito pasado: **used to + base**."],["Did you ___ live here?","use to","used to","using to","use","Con did → **use to** (sin d)."],["He ___ smoke, but he stopped.","used to","is used to","uses to","use","Hábito que ya terminó → **used to**."]]},
{l:"B2",id:"b2-1",e:"⏮️",t:"Tercer condicional",x:["Habla de situaciones **imaginarias en el pasado**, que ya no se pueden cambiar: If I **had studied**, I **would have passed**.","Estructura: **If + had + participio, would have + participio**. Sirve para arrepentimientos y reproches."],g:[["If I had known, I would have called.","Si lo hubiera sabido, habría llamado."],["She would have won if she had trained.","Habría ganado si hubiera entrenado."],["If we had left earlier, we wouldn't have missed the bus.","Si hubiéramos salido antes, no habríamos perdido el bus."]],k:"Pasado imaginario: if + had + participio → would have + participio.",q:[["If I ___ harder, I would have passed.","had studied","studied","would study","have studied","if + **had + participio**."],["She would have come if you ___ her.","had invited","invited","would invite","have invited","if + **had + participio**."],["If they had left earlier, they ___ the train.","would have caught","would catch","caught","will catch","Resultado: **would have + participio**."]]},
{l:"B2",id:"b2-2",e:"🌠",t:"Wish e If only",x:["**wish** expresa deseos sobre algo que no es real. Presente: **wish + pasado simple**: I wish I **had** more time (pero no tengo).","Arrepentimiento del pasado: **wish + had + participio**: I wish I **had gone**. Para quejas: **wish + would**: I wish he **would stop**."],g:[["I wish I had a car.","Ojalá tuviera un carro."],["She wishes she had studied.","Ella desearía haber estudiado."],["I wish it would stop raining.","Ojalá dejara de llover."]],k:"Tras wish retrocedemos un tiempo: presente real → pasado; pasado real → had + participio.",q:[["I wish I ___ taller.","were","am","will be","would be","Deseo irreal del presente → pasado (**were**)."],["I wish I ___ to the party last night.","had gone","went","go","would go","Arrepentimiento del pasado → **had + participio**."],["I wish he ___ making so much noise.","would stop","stops","stopped","stop","Queja sobre algo molesto → **wish + would**."]]},
{l:"B2",id:"b2-3",e:"🗣️",t:"Estilo indirecto",x:["Para contar lo que alguien dijo, el verbo **retrocede un tiempo**: «I am tired» → She said she **was** tired.","Cambios típicos: present → past, will → would, can → could, now → then, today → that day. Con **told** hace falta la persona: He told **me**…"],g:[["She said she was tired.","Dijo que estaba cansada."],["He told me he would come.","Me dijo que vendría."],["They said they could help.","Dijeron que podían ayudar."]],k:"say sin persona (she said that…) · tell con persona (she told me that…).",q:[["«I am hungry», he said. → He said he ___ hungry.","was","is","will be","has been","Retrocede: am → **was**."],["«I will call you.» → She said she ___ call me.","would","will","can","did","will → **would**."],["He ___ me that he was late.","told","said","spoke","talked","Con persona (me) se usa **told**."]]},
{l:"C1",id:"c1-1",e:"🔄",t:"Inversión",x:["Con adverbios negativos al inicio (**rarely, never, not only, hardly, scarcely**) el auxiliar va **antes del sujeto**: Rarely **have I** seen such talent.","También en condicionales formales: **Had I known**, I would have helped (= If I had known). Y: **Not only did he** forget, but he also lied."],g:[["Never have I seen such a view.","Nunca he visto una vista así."],["Not only did she win, but she also broke the record.","No solo ganó, sino que batió el récord."],["Had I known, I would have helped.","De haberlo sabido, habría ayudado."]],k:"Adverbio negativo al inicio → auxiliar + sujeto + verbo (como en una pregunta).",q:[["Never ___ such a beautiful place.","have I seen","I have seen","I saw","did I saw","Tras **never** va inversión: have I seen."],["Not only ___ late, but he also forgot.","was he","he was","is he","he is","Inversión: **was he**."],["Hardly ___ arrived when it started to rain.","had we","we had","we have","did we","Hardly + **had + sujeto**."]]},
{l:"C1",id:"c1-2",e:"📜",t:"Subjuntivo",x:["Tras **suggest, insist, demand, recommend, propose** el verbo va en **forma base**, sin -s ni tiempo: She insisted that he **be** present.","También con **It is important / essential / vital that**: It is essential that she **arrive** on time (no «arrives»). Negativa: that he **not** go."],g:[["I suggest that he see a doctor.","Sugiero que vea a un médico."],["It is vital that she be on time.","Es vital que ella llegue a tiempo."],["They demanded that he resign.","Exigieron que renunciara."]],k:"Mismo verbo base para todos: that he **go**, that she **be**, that they **leave**.",q:[["He suggested that she ___ a doctor.","see","sees","saw","would sees","Subjuntivo: verbo **base**."],["It is essential that he ___ on time.","be","is","was","will be","Subjuntivo de be → **be**."],["The manager insisted that we ___ the report today.","finish","finishes","finished","finishing","Tras insist that → verbo **base**."]]},
{l:"C2",id:"c2-1",e:"🔗",t:"Relativas: whose y which",x:["**whose** indica posesión, para personas y cosas: The author, **whose** books are famous, lives here.","Entre comas (relativas no restrictivas) se usa **which** (cosas) o **who** (personas), nunca that: My car, **which** is old, still works. **which** también comenta toda la frase: He passed, **which** surprised everyone."],g:[["The woman whose son is a doctor lives next door.","La mujer cuyo hijo es médico vive al lado."],["My phone, which is new, is broken.","Mi teléfono, que es nuevo, está dañado."],["He apologised, which surprised me.","Pidió perdón, lo cual me sorprendió."]],k:"Con comas → which / who (nunca that). Posesión → whose.",q:[["The proposal, ___ merits are obvious, was rejected.","whose","which","who","that","Posesión (sus méritos) → **whose**."],["My laptop, ___ I bought last year, stopped working.","which","that","who","whose","Entre comas, cosa → **which**."],["She won the prize, ___ made us proud.","which","what","that","who","Comenta toda la frase → **which**."]]},
{l:"C2",id:"c2-2",e:"🎩",t:"Condicionales formales",x:["Estructuras elegantes que reemplazan a **if**: **Were it not for** you, I would have failed (= si no fuera por ti).","Más: **Should you need help, call me** (= if you need help). **Provided that / As long as** (con tal de que). **Unless** (a menos que) ya lleva sentido negativo."],g:[["Were it not for his help, we would have failed.","Si no fuera por su ayuda, habríamos fracasado."],["Should you need anything, call me.","Si necesitas algo, llámame."],["Provided that you pay, you can enter.","Siempre que pagues, puedes entrar."]],k:"Quitas if e inviertes: Were it not for… · Should you… · Had I…",q:[["___ it not for you, I would have failed.","Were","Was","If","Had","Fórmula fija: **Were it not for**."],["___ you need help, call me.","Should","Would","Will","Did","If you should need → **Should you need**."],["You can go ___ you finish your work.","provided that","unless","although","despite","**provided that** = con tal de que."]]}];

const NU=[
{l:"A1",id:"a1-9",e:"🏷️",t:"El 's: posesivo, is y has",x:["Para decir *de quién es* algo se usa **'s**: Ana's phone = el teléfono de Ana. Va después del dueño, no «the phone of Ana».","El mismo **'s** también puede ser **is** (She's happy) o **has** (He's got a car); el contexto decide. Plural que termina en s: solo apóstrofo (my parents' house)."],g:[["This is Ana's phone.","Este es el teléfono de Ana."],["She's my sister.","Ella es mi hermana."],["My parents' house is big.","La casa de mis padres es grande."]],k:"Dueño + 's + cosa. Nunca «Anas phone».",q:[["This is ___ book.","Maria's","Marias","Maria","Marias'","Dueño singular → **'s**."],["It ___ cold today. (it is)","'s","s","'","ss","**'s** abrevia is: It's cold."],["The ___ room is small. (varios niños)","kids'","kid's","kids","kids's","Plural con s → solo **'**."]]},
{l:"A1",id:"a1-10",e:"💧",t:"Contables: some, any, much, many",x:["**Contables** se cuentan (apple, car): llevan a/an y plural. **Incontables** no (water, money, advice): sin -s y sin a/an.","Contables → **many**, a few. Incontables → **much**, a little. **A lot of** sirve para ambos. **Some** en afirmativas, **any** en preguntas y negativas."],g:[["How many books do you have?","¿Cuántos libros tienes?"],["I don't have much money.","No tengo mucho dinero."],["Do you have any water?","¿Tienes agua?"]],k:"Information, advice, money, water: incontables. «Informations» ✗.",q:[["How ___ people are here?","many","much","a","any","People es contable → **many**."],["I need some ___.","advice","advices","an advice","advices'","Advice es incontable: sin -s."],["We don't have ___ milk.","any","some","many","a","Negativa + incontable → **any**."]]},
{l:"A1",id:"a1-11",e:"🔁",t:"Adverbios de frecuencia",x:["Dicen *cuántas veces*: **always**, **usually**, **often**, **sometimes**, **rarely**, **never**.","Van **antes del verbo**: I always study. Pero **después de to be**: She is always late."],g:[["I usually wake up at six.","Normalmente me despierto a las seis."],["He is never late.","Él nunca llega tarde."],["We sometimes eat out.","A veces comemos fuera."]],k:"Never ya es negativo: no «don't never».",q:[["She ___ drinks coffee.","always","is always","always is","do always","Antes del verbo: She **always** drinks."],["He is ___ late.","never","do never","not never","never is","Tras is: is **never** late."],["I ___ eat meat. (nunca)","never","don't never","not never","no never","Never ya niega: I **never** eat."]]},
{l:"A2",id:"a2-8",e:"🔮",t:"Will: decisiones, promesas, predicciones",x:["**Will + verbo base** expresa futuro en tres casos: **decisión del momento** (I'll call a taxi), **promesa** (I will help you) y **predicción** (It will rain).","Igual para todos los sujetos: sin -s y sin *to*: «She will goes» ✗. Negativa: **won't**. Pregunta: Will you come?"],g:[["I'll open the door.","Yo abro la puerta."],["She won't be late.","Ella no llegará tarde."],["Will you help me?","¿Me ayudas?"]],k:"will + verbo base. Ni -s, ni to, ni -ing.",q:[["It's hot. I ___ open the window.","will","am going to","opens","will to","Decisión del momento → **will**."],["She ___ come tomorrow. (no vendrá)","won't","doesn't","isn't","not will","Negativa de will → **won't**."],["He will ___ you.","help","helps","to help","helping","Tras will, verbo base."]]},

<script>

(()=>{
  const root=document.documentElement, main=document.querySelector('#v');

  // Animate only when the user has not requested reduced motion.

    cancelAnimationFrame(frame);
    frame=requestAnimationFrame(()=>{
      if(reduce)return;

      // Force a style boundary only for the small view container, not the full page.
      void main.offsetWidth;
      main.classList.add('view-enter');

  };

    if(replaced){animateView();}
  });

  const reveal=new MutationObserver(()=>{
    if(reduce)return;
    main.querySelectorAll('.card:not([data-eq-seen]),.game:not([data-eq-seen]),.level-card:not([data-eq-seen]),.metric:not([data-eq-seen])').forEach((el,i)=>{
      el.dataset.eqSeen='1';el.classList.add('eq-reveal');el.style.animationDelay=Math.min(i*28,140)+'ms';
      el.addEventListener('animationend',()=>{el.classList.remove('eq-reveal');el.style.animationDelay=''}, {once:true});
    });
  });
  reveal.observe(main,{childList:true,subtree:true});
  // Gentle haptics on answer selection where supported. Never required for function.
  document.addEventListener('click',e=>{
    const b=e.target.closest('button');
    if(!b||b.disabled||!navigator.vibrate)return;
    if(b.matches('.opt,[data-coach-answer],[data-g],[data-v]')){try{navigator.vibrate(8)}catch(_){}}
  },{passive:true});
  // Keep the viewport stable in app-like use while retaining OS accessibility settings.
  document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')root.classList.add('eq-active')},{passive:true});
  // Expose a tiny helper for concise screen-reader announcements from later features.
  window.eqAnnounce=(message)=>{live.textContent='';requestAnimationFrame(()=>{live.textContent=String(message||'')})};
  // Warn before leaving with unsaved form text only when a future screen uses a draft field.
  window.addEventListener('error',e=>{if(typeof toast==='function'&&e.message)toast('Ocurrió un error inesperado. Puedes volver a Inicio e intentarlo de nuevo.')});
})();
</script>
